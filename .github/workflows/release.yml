name: release

# Push a tag like v0.2.0 to build the Windows installers and attach them to a
# draft GitHub release. Publish the draft when you've smoke-tested them.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: FinCompass ${{ github.ref_name }}
          releaseBody: Windows installers (NSIS .exe and .msi). See the README for what's new.
          releaseDraft: true
          prerelease: false
